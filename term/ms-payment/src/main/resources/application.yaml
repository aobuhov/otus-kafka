server:
  port: 8083

spring:
  application:
    name: ms-payment
  datasource:
    url: jdbc:postgresql://localhost:5432/payments_db
    username: payments_user
    password: AppAdmin123!
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: ms-payment
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JacksonJsonDeserializer
      properties:
        spring.json.trusted.packages: "ru.otus.kafka.obukhov.term.*"
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer
      properties:
        spring.json.add.type.headers: false
    template:
      observation-enabled: true   # Пробрасывает traceId в Kafka-сообщения
    listener:
      observation-enabled: true   # Восстанавливает traceId при чтении из Kafka
      ack-mode: record
      consumer:
        properties:
          max.poll.records: 100
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

audit:
  enabled: true
  topic: audit.events
  exclude-paths:
    - /actuator/**
    - /health

management:
  tracing:
    enabled: true
    sampling:
      probability: 1.0

