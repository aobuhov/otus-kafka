server:
  port: 8081

spring:
  application:
    name: ms-order
  datasource:
    url: jdbc:postgresql://localhost:5432/orders_db
    username: orders_user
    password: AppAdmin123!
  kafka:
    bootstrap-servers: localhost:29092   # EXTERNAL listener для запуска из IDE
    consumer:
      group-id: ms-order
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "ru.otus.kafka.obukhov.term.*"
        spring.json.value.default.type: "ru.otus.kafka.obukhov.term.order.dto.OrderStatusEvent"
        spring.json.use.type.headers: false
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      properties:
        spring.json.add.type.headers: false
    template:
      observation-enabled: true   # Пробрасывает traceId в Kafka-сообщения
    listener:
      observation-enabled: true   # Восстанавливает traceId при чтении из Kafka
      ack-mode: record
      consumer:
        properties:
          max.poll.records: 100
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration  # Где будут лежать SQL-файлы
    baseline-on-migrate: true  # Для случая, если БД уже не пустая

audit:
  enabled: true
  topic: audit.events
  exclude-paths:
    - /actuator/**
    - /health

management:
  tracing:
    enabled: true
    sampling:
      probability: 1.0

