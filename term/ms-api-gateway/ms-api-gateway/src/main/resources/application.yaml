

server:
  port: 8080

spring:
  application:
    name: ms-api-gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: order-service
              uri: http://localhost:8081
              predicates:
                - Path=/api/v1/orders/**
              filters:
                - StripPrefix=0
            - id: restaurant-service
              uri: http://localhost:8082
              predicates:
                - Path=/api/v1/restaurants/**
              filters:
                - StripPrefix=0
            - id: payment-service
              uri: http://localhost:8083
              predicates:
                - Path=/api/v1/payments/**
              filters:
                - StripPrefix=0
            - id: delivery-service
              uri: http://localhost:8084
              predicates:
                - Path=/api/v1/deliveries/**
              filters:
                - StripPrefix=0
            - id: audit-service
              uri: http://localhost:8085
              predicates:
                - Path=/api/v1/audit/**
              filters:
                - StripPrefix=0
          globalcors:
            cors-configurations:
              '[/**]':
                allowedOrigins:
                  - "http://localhost:3000"
                  - "http://localhost:4200"
                allowedMethods:
                  - GET
                  - POST
                  - PUT
                  - DELETE
                  - OPTIONS
                allowedHeaders: "*"
                allowCredentials: true
  security:
    oauth2:
      resourceserver:
        jwt:
          secret-key: "my-super-secret-key-for-jwt-signing-1234567890"
management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
  endpoint:
    gateway:
      access: unrestricted
  tracing:
    enabled: true
    sampling:
      probability: 1.0

audit:
  enabled: true
  topic: audit.events
  exclude-paths:
    - /actuator/**
    - /health
